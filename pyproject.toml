[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tractor-search"
version = "0.5.1"
description = "TRACTOR — local-first global intelligence search"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {file = "LICENSE"}
dependencies = [
  "PySide6>=6.8,<6.9",
  "httpx[socks]>=0.28,<1",
  "platformdirs>=4,<5",
  "langdetect>=1.0.9,<2",
  "text-unidecode>=1.3,<2",
  "beautifulsoup4>=4.12,<5",
  "protego>=0.6,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "pytest-qt>=4.4,<5", "ruff>=0.9,<1", "build>=1.2,<2"]

[project.scripts]
tractor = "tractor.app:main"

[tool.hatch.build.targets.wheel]
packages = ["tractor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: explicitly enabled live-service checks"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
