name: Release
on:
  push:
    branches: [main]
    paths: [pyproject.toml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/checks.yml
  publish:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: dist/release
          merge-multiple: true
      - name: Assemble source and native assets
        run: |
          cp dist/*.whl dist/*.tar.gz dist/release/
          cd dist/release
          sha256sum * > SHA256SUMS.txt
      - name: Publish version tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Release v$version already exists; immutable assets were left unchanged."
            exit 0
          fi
          gh release create "v$version" --target "$GITHUB_SHA" --title "TRACTOR $version — Browser Search" --notes-file docs/release-0.5.md dist/release/*
