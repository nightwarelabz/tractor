<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Tractor Search</title>
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/search-ui/style.css">
</head>
<body>
  <header class="masthead">
    <a class="brand" href="/search" aria-label="Tractor Search home"><img src="/assets/icon.svg" alt=""><span>TRACTOR</span></a>
    <form id="search-form" role="search"><input id="query" name="q" type="search" autocomplete="off" required aria-label="Search the web"><button type="submit">Search</button></form>
  </header>
  <main>
    <div class="heading"><div><p class="eyebrow">Recursive web search</p><h1 id="page-title">Search the web</h1></div><button id="stop" class="quiet" type="button" hidden>Stop search</button></div>
    <p id="status" role="status" aria-live="polite">Preparing Tractor search…</p>
    <nav id="filters" aria-label="Filter results" hidden>
      <button class="filter selected" data-filter="all">All</button><button class="filter" data-filter="web">Websites</button><button class="filter" data-filter="images">Images</button><button class="filter" data-filter="research">Research</button>
    </nav>
    <section id="results" aria-label="Search results"></section>
    <footer><span>Search results combine Tractor’s enabled public providers. Coverage varies by provider.</span><span>Destination links open in Orc.</span></footer>
  </main>
  <script src="/search-ui/app.js" defer></script>
</body>
</html>
